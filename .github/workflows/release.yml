name: Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/apppulse-internal.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=apppulse-internal.jks"
          } > android/key.properties

      - name: Resolve version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          TAG="v${NAME}+${CODE}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk AppPulse.apk

      - name: Write version.json
        run: |
          cat > version.json <<EOF
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "tag": "${{ steps.version.outputs.tag }}"
          }
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          NOTES="$(cat <<EOF
          AppPulse ${NAME} (versionCode ${CODE})

          Install or update over the previous internally signed build.
          In the app: Settings → Check for updates, or accept the update prompt.

          versionCode: ${CODE}
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AppPulse.apk version.json --clobber
          else
            gh release create "$TAG" AppPulse.apk version.json \
              --title "AppPulse ${NAME}" \
              --notes "$NOTES"
          fi
