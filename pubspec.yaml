name: app_pulse
description: "AppPulse — Know Where Your Time Goes. Offline Android app usage analytics."
publish_to: "none"
version: 1.0.2+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  go_router: ^15.1.2

  # Persistence
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Models & serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2

  # UI
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  fl_chart: ^0.71.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Platform services
  permission_handler: ^12.0.0+1
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0
  flutter_local_notifications: ^19.2.1
  workmanager: ^0.7.0
  flutter_foreground_task: ^9.1.0

  # Logging & utilities
  logger: ^2.5.0
  share_plus: ^11.0.0
  cross_file: ^0.3.4+2
  pdf: ^3.12.0
  csv: ^8.0.0
  http: ^1.4.0
  # 11.x skips Kotlin on AGP 9 when builtInKotlin=false (Flutter default) and
  # fails to compile FilePickerPlugin. Pin to 10.x until that combo is fixed.
  file_picker: 10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.26.1
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/
